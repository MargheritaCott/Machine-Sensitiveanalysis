name: CI/CD - Sentiment Analysis Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  # ---------------------------------------------------------------------
  # 1. LINT & UNIT / INTEGRATION TEST
  # ---------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint (flake8)
        run: flake8 src --max-line-length=120 --extend-ignore=E203

      - name: Run unit & integration tests
        run: pytest tests/ -v

  # ---------------------------------------------------------------------
  # 2. BUILD CHECK (verifica installazione pulita delle dipendenze)
  # ---------------------------------------------------------------------
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verifica build ambiente
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "from src.sentiment_model import SentimentAnalyzer; print('Build OK')"

  # ---------------------------------------------------------------------
  # 3. DEPLOY (facoltativo) - solo su release, se è configurato HF_TOKEN
  # ---------------------------------------------------------------------
  deploy:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Deploy su Hugging Face Hub / Spaces
        if: env.HF_TOKEN != ''
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          api.upload_folder(
              folder_path="src",
              repo_id="machineinnovators/social-sentiment-monitor",
              repo_type="space",
          )
          print("Deploy completato su Hugging Face Spaces.")
          PY

      - name: Skip deploy (nessun HF_TOKEN configurato)
        if: env.HF_TOKEN == ''
        run: 'echo "HF_TOKEN non configurato: deploy facoltativo saltato."'
